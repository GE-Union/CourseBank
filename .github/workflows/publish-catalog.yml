name: Validate and publish course catalog

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - catalog.v2.json
      - structure.json

concurrency:
  group: course-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run compiler tests
        run: python -m unittest discover -s .github/tests -v
      - name: Validate catalog and resources
        run: python .github/scripts/build_catalog.py --validate

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile public manifests
        run: python .github/scripts/build_catalog.py
      - name: Publish changed manifests
        run: |
          if git diff --quiet -- catalog.v2.json structure.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.v2.json structure.json
          git commit -m "chore: publish course catalog [skip ci]"
          git push
